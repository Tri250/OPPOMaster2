name: 💡 功能建议
description: 提出新功能或改进建议
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      placeholder: 例如「我想把朋友发我的预设一键导入，现在只能手动抄参数」
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 备选方案（可选）
