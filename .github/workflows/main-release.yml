name: Main Release

# 修复 P2-15: 添加主分支正式发版 CI 流程

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'           # 正式版本标签，如 v1.3.1
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'       # RC 候选版本，如 v1.3.1-rc1
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签 (例如: v1.3.1)'
        required: true
        type: string
      release_name:
        description: 'Release 名称 (留空则使用标签)'
        required: false
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-universal
          path: app/build/outputs/apk/release/*-universal-*.apk
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-armeabi-v7a
          path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk
          retention-days: 30

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          retention-days: 30

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-x86
          path: app/build/outputs/apk/release/*-x86-*.apk
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-x86_64
          path: app/build/outputs/apk/release/*-x86_64-*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=${{ github.event.inputs.prerelease }}" >> $GITHUB_ENV
          fi

      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "❌ 错误: 标签格式不正确，请使用 vX.Y.Z 格式"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" == "$TAG" ]; then
            echo "📝 首个版本或无法找到上一个标签"
            git-cliff --unreleased --output RELEASE_NOTES.md
          else
            echo "📝 生成从 $PREVIOUS_TAG 到 $TAG 的更新日志"
            git-cliff ${PREVIOUS_TAG}..${TAG} --output RELEASE_NOTES.md
          fi
          echo "📋 生成的 Release 说明："
          cat RELEASE_NOTES.md

      - name: Create and push tag (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git tag --list | grep -q "^${TAG}$"; then
            git tag $TAG
            git push origin $TAG
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./apk
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ github.event.inputs.release_name || env.TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          files: ./apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "🎉 Release 创建成功！"
          echo "  标签: ${{ env.TAG }}"
          echo "  名称: ${{ github.event.inputs.release_name || env.TAG }}"
          echo "  预发布: ${{ env.IS_PRERELEASE }}"
          echo "🔗 查看地址: https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG }}"
