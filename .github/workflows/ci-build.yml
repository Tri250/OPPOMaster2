name: CI Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 代码质量检查
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # CI 环境：使用专用 settings 文件
      - name: Use CI Settings
        run: |
          if [ -f settings.ci.gradle.kts ]; then
            mv settings.gradle.kts settings.gradle.kts.local
            cp settings.ci.gradle.kts settings.gradle.kts
            echo "✅ CI settings 配置已切换"
          else
            echo "⚠️ settings.ci.gradle.kts 不存在，使用默认配置"
          fi

      # 配置友盟 AppKey（从 GitHub Secrets 注入）
      - name: Configure UMENG AppKey
        run: |
          if [ -n "${{ secrets.UMENG_APPKEY }}" ]; then
            echo "UMENG_APPKEY=${{ secrets.UMENG_APPKEY }}" >> local.properties
            echo "UMENG_MESSAGE_SECRET=${{ secrets.UMENG_MESSAGE_SECRET }}" >> local.properties
            echo "✅ UMENG AppKey 已配置"
          else
            echo "⚠️ UMENG_APPKEY 未在 Secrets 中配置，友盟统计将不可用"
          fi

      # Kotlin 代码风格检查
      - name: Run Kotlin Linter (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      # Android Lint 检查
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      # 编译检查
      - name: Compile Check
        run: ./gradlew compileDebugKotlin compileDebugJavaWithJavac --no-daemon

  # 单元测试
  unit-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # CI 环境：使用专用 settings 文件
      - name: Use CI Settings
        run: |
          if [ -f settings.ci.gradle.kts ]; then
            mv settings.gradle.kts settings.gradle.kts.local
            cp settings.ci.gradle.kts settings.gradle.kts
            echo "✅ CI settings 配置已切换"
          else
            echo "⚠️ settings.ci.gradle.kts 不存在，使用默认配置"
          fi

      # 运行单元测试
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 上传测试报告
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

  # 测试覆盖率
  coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # CI 环境：使用专用 settings 文件
      - name: Use CI Settings
        run: |
          if [ -f settings.ci.gradle.kts ]; then
            mv settings.gradle.kts settings.gradle.kts.local
            cp settings.ci.gradle.kts settings.gradle.kts
            echo "✅ CI settings 配置已切换"
          else
            echo "⚠️ settings.ci.gradle.kts 不存在，使用默认配置"
          fi

      # 运行测试覆盖率
      - name: Run Test Coverage
        run: ./gradlew jacocoTestReport --no-daemon || ./gradlew createDebugCoverageReport --no-daemon

      # 上传覆盖率报告
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            app/build/reports/jacoco/
            app/build/reports/coverage/
          retention-days: 7

      # 发布到 Codecov (可选)
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: false
          verbose: true

  # 构建 Debug APK
  build-debug:
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # CI 环境：使用专用 settings 文件
      - name: Use CI Settings
        run: |
          if [ -f settings.ci.gradle.kts ]; then
            mv settings.gradle.kts settings.gradle.kts.local
            cp settings.ci.gradle.kts settings.gradle.kts
            echo "✅ CI settings 配置已切换"
          else
            echo "⚠️ settings.ci.gradle.kts 不存在，使用默认配置"
          fi

      # 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 上传 Universal APK
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-universal
          path: app/build/outputs/apk/debug/*-universal-*.apk
          retention-days: 7

      # 上传各架构 APK
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-*.apk
          retention-days: 7

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-*.apk
          retention-days: 7

  # 构建 Release APK (需要签名)
  build-release:
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # CI 环境：使用专用 settings 文件
      - name: Use CI Settings
        run: |
          if [ -f settings.ci.gradle.kts ]; then
            mv settings.gradle.kts settings.gradle.kts.local
            cp settings.ci.gradle.kts settings.gradle.kts
            echo "✅ CI settings 配置已切换"
          else
            echo "⚠️ settings.ci.gradle.kts 不存在，使用默认配置"
          fi

      # 构建 Release APK (使用 debug 签名)
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      # 上传 Universal APK
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-universal
          path: app/build/outputs/apk/release/*-universal-*.apk
          retention-days: 30

      # 上传各架构 APK
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          retention-days: 30

  # 依赖安全检查
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # CI 环境：使用专用 settings 文件
      - name: Use CI Settings
        run: |
          if [ -f settings.ci.gradle.kts ]; then
            mv settings.gradle.kts settings.gradle.kts.local
            cp settings.ci.gradle.kts settings.gradle.kts
            echo "✅ CI settings 配置已切换"
          else
            echo "⚠️ settings.ci.gradle.kts 不存在，使用默认配置"
          fi

      # 依赖版本检查
      - name: Check Dependency Updates
        run: ./gradlew dependencyUpdates --no-daemon

      # 生成依赖报告
      - name: Generate Dependency Report
        run: ./gradlew dependencies --configuration releaseRuntimeClasspath --no-daemon > dependencies.txt

      - name: Upload Dependencies Report
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-report
          path: dependencies.txt
          retention-days: 7
