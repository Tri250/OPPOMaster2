# Project-wide Gradle settings.
# 沙箱环境深度优化配置
# 更新时间: 2026-06-12
# 网络诊断结果: 腾讯云镜像可达，响应 0.05s

# ===== 1. Gradle Daemon + JVM 调优 =====
# 关键修复: 沙箱网络环境强制走 127.0.0.1:18080 HTTP 代理
# 验证结果: 代理可达 mirrors.cloud.tencent.com / repo1.maven.org / plugins.gradle.org / dl.google.com / maven.aliyun.com
# 直连全部超时，必须通过代理
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=18080 -Dhttp.nonProxyHosts=localhost|127.0.0.1|10.*|192.168.*|*.local -Dhttps.nonProxyHosts=localhost|127.0.0.1|10.*|192.168.*|*.local -Dkotlin.daemon.jvmargs=-Xmx2g -Dhttp.proxyHost=127.0.0.1 -Dhttps.proxyHost=127.0.0.1
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# ===== 2. 构建缓存 =====
org.gradle.caching=true
org.gradle.configuration-cache=false
# 本地构建缓存目录（沙箱环境固定到 workspace，加速跨项目复用）
org.gradle.caching.local.dir=${WORKSPACE_DIR:-/workspace}/.gradle/build-cache
# 构建缓存 TTL（7 天）
org.gradle.caching.local.ttl.days=7

# ===== 3. Kotlin 编译优化 =====
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.enabled=true
kotlin.compiler.execution.strategy=in-process

# ===== 4. 网络优化配置 =====
# HTTPS 配置
systemProp.https.protocols=TLSv1.2,TLSv1.3

# 超时配置 - 沙箱环境优化（5分钟）
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.http.connectionTimeout=300000
systemProp.http.socketTimeout=300000
systemProp.https.connectionTimeout=300000
systemProp.https.socketTimeout=300000

# 重试配置 - 指数退避策略
systemProp.org.gradle.internal.network.retry.max.attempts=10
systemProp.org.gradle.internal.network.retry.initial.backOff=1000
systemProp.org.gradle.internal.network.retry.max.backOff=10000
systemProp.org.gradle.internal.network.retry.backOff.multiplier=2

# ===== 5. 代理配置（沙箱环境 - 关键） =====
# 沙箱环境强制走 127.0.0.1:18080 HTTP 代理（直连外网被防火墙阻断）
# 验证: 通过代理可访问 mirrors.cloud.tencent.com / dl.google.com / repo1.maven.org / maven.aliyun.com 等
# org.gradle.jvmargs 中已设置 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080
# 保留 nonProxyHosts 仅排除本地地址（避免代理尝试转发本地流量）
systemProp.http.nonProxyHosts=localhost|127.0.0.1|10.*|192.168.*|*.local|::1
systemProp.https.nonProxyHosts=localhost|127.0.0.1|10.*|192.168.*|*.local|::1

# ===== 6. Android 配置 =====
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableResourceNamespaces=true

# ===== 7. 安全配置（发布前填入真实值） =====
# 友盟统计 AppKey（从代码中移除，通过构建注入）
UMENG_APPKEY=YOUR_UMENG_APPKEY
UMENG_MESSAGE_SECRET=YOUR_UMENG_MESSAGE_SECRET

# Release 签名配置（发布前填入）
# RELEASE_STORE_FILE=release.keystore
# RELEASE_STORE_PASSWORD=YOUR_STORE_PASSWORD
# RELEASE_KEY_ALIAS=omaster
# RELEASE_KEY_PASSWORD=YOUR_KEY_PASSWORD

# ===== 8. 离线模式配置（可选） =====
# 启用离线模式时取消注释（需要先完整构建一次下载所有依赖）
# org.gradle.offline=true

# ===== 9. 日志级别 =====
# 详细日志（调试网络问题时启用）
# org.gradle.logging.level=debug

# ===== 10. 构建性能监控 =====
# 构建时间分析（调试时启用）
# org.gradle.build-time-analysis=true