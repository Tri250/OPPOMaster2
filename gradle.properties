# Project-wide Gradle settings.
# 国内网络环境深度优化配置
# 更新时间: 2026-06-12
# 优化策略: 腾讯云镜像优先 + 多级超时 + 智能重试

# ===== 1. Gradle Daemon + JVM 调优 =====
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# ===== 2. 构建缓存 =====
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.max-problems=5

# ===== 3. 网络优化配置（离线优先） =====
# 使用本地缓存优先
org.gradle.offline=false

# 超时配置 - 缩短超时时间
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

# 重试配置 - 减少重试次数
systemProp.org.gradle.internal.network.retry.max.attempts=3
systemProp.org.gradle.internal.network.retry.initial.backOff=500
systemProp.org.gradle.internal.network.retry.max.backOff=3000
systemProp.org.gradle.internal.network.retry.backOff.multiplier=2

# ===== 4. 代理配置（如需要） =====
# systemProp.http.proxyHost=proxy.example.com
# systemProp.http.proxyPort=8080
# systemProp.https.proxyHost=proxy.example.com
# systemProp.https.proxyPort=8080

# ===== 5. 镜像源配置 =====
systemProp.gradle.user.home=/root/.gradle

# ===== 6. Android 配置 =====
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableResourceNamespaces=true

# ===== 7. 离线模式配置（可选） =====
# 启用离线模式时取消注释下面这行
# org.gradle.offline=true

# ===== 8. 日志级别 =====
# org.gradle.logging.level=info
