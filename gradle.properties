# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=256m

# 关闭并行模式
org.gradle.parallel=false

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Android R class
android.nonTransitiveRClass=true

# =====================================================
# 代理配置（当前环境需要通过代理访问外网）
# =====================================================
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.*|10.*|192.168.*

# =====================================================
# 网络配置 - 超时、重试
# =====================================================

# 网络超时配置（30秒，快速跳过不可用仓库）
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000

# 网络重试配置
systemProp.org.gradle.internal.network.retry.max.attempts=3
systemProp.org.gradle.internal.network.retry.initial.backOff=1000

# =====================================================
# 构建配置
# =====================================================

# 禁用 Configuration Cache
org.gradle.configuration-cache=false

# 禁用构建缓存
org.gradle.caching=false

# 禁用守护进程
org.gradle.daemon=false

# 禁用按需加载
org.gradle.configureondemand=false

# =====================================================
# 资源压缩 - 减少 APK 体积
# =====================================================
android.enableR8.fullMode=true
android.enableJetifier=false
