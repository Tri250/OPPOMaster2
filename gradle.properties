# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ==================== JVM 配置 ====================
# 增加堆内存，避免OOM
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ParallelGCThreads=2

# ==================== 构建性能优化（网络受限环境调整）====================
# 禁用并行构建（网络不稳定时避免并发下载失败）
org.gradle.parallel=false
# 禁用按需配置（确保所有依赖都解析）
org.gradle.configureondemand=false
# 启用构建缓存
org.gradle.caching=true
# 禁用配置缓存（避免网络问题导致的缓存失效）
org.gradle.configuration-cache=false
# 禁用文件系统监视（减少资源占用）
org.gradle.vfs.watch=false

# ==================== Android 构建优化 ====================
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ==================== 网络超时配置（大幅增加）====================
# Gradle 内部 HTTP 超时（毫秒）
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

# 网络重试配置
systemProp.org.gradle.internal.network.retry.max.attempts=10
systemProp.org.gradle.internal.network.retry.initial.backOff=5000

# HTTP 客户端超时
systemProp.http.connectionTimeout=300000
systemProp.http.socketTimeout=300000
systemProp.https.connectionTimeout=300000
systemProp.https.socketTimeout=300000

# ==================== HTTP 代理配置（如需使用请取消注释）====================
# 国内常用代理配置示例：
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.huaweicloud.com|*.aliyun.com|*.tencent.com

# ==================== 离线构建配置 ====================
# 启用离线模式（依赖已下载后使用）
# org.gradle.offline=true

# ==================== 镜像源验证配置 ====================
# 强制使用特定仓库（用于验证）
systemProp.repository.priority=huawei,aliyun,tencent,tsinghua,official
