# Project-wide Gradle settings.
# 深度优化配置 - 2026-06-12
# 适用于高性能构建环境

# ===== 1. Gradle Daemon 深度优化 =====
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# JVM 内存优化 - 根据系统配置调整
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/gradle-heap-dump.hprof -Dfile.encoding=UTF-8 -Dsun.io.useCanonCaches=false -Djava.awt.headless=true

# 并行执行优化
org.gradle.workers.max=8
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# ===== 2. 构建缓存深度优化 =====
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.max-problems=10
org.gradle.configuration-cache.problems=warn

# 本地构建缓存
org.gradle.buildcache.local.enabled=true
org.gradle.buildcache.local.directory=/root/.gradle/build-cache

# ===== 3. 网络优化配置 =====
systemProp.http.ssl.insecure=true
systemProp.https.protocols=TLSv1.2,TLSv1.3

# 超时配置 - 增加重试和超时时间
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.retry.max.attempts=20
systemProp.org.gradle.internal.http.retry.initial.backOff=1000
systemProp.org.gradle.internal.http.retry.max.backOff=10000

# 网络重试配置
systemProp.org.gradle.internal.network.retry.max.attempts=20
systemProp.org.gradle.internal.network.retry.initial.backOff=1000
systemProp.org.gradle.internal.network.retry.max.backOff=10000

# ===== 4. 镜像源配置 =====
systemProp.gradle.user.home=/root/.gradle

# ===== 5. Android 构建优化 =====
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableResourceNamespaces=true

# Android Gradle Plugin 优化
android.enableBuildCache=true
android.buildCacheDir=/root/.gradle/android-build-cache

# 编译优化
android.enableIncrementalAnnotationProcessing=true
android.enableSeparateAnnotationProcessing=true

# R8/ProGuard 优化
android.enableR8.fullMode=true
android.enableDexingArtifactTransform.desugaring=false

# ===== 6. Kotlin 优化 =====
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.android=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# KAPT 优化
kapt.incremental.apt=true
kapt.include.compile.classpath=false

# ===== 7. Compose 优化 =====
android.enableComposeCompilerMetrics=true
android.enableComposeCompilerReports=true

# ===== 8. 测试优化 =====
android.testInstrumentationRunnerArguments.size=medium

# ===== 9. 离线模式配置（可选） =====
# org.gradle.offline=true

# ===== 10. 日志和调试 =====
# org.gradle.logging.level=info
# org.gradle.warning.mode=all

# ===== 11. 性能监控 =====
org.gradle.profile=true
