# Project-wide Gradle settings.
# 沙箱环境深度优化配置
# 更新时间: 2026-06-12
# 网络诊断结果: 腾讯云镜像可达，响应 0.05s

# ===== 1. Gradle Daemon + JVM 调优 =====
# 代理配置已移至 ~/.gradle/gradle.properties（用户级）或 CI 环境变量注入
# 主仓库必须零代理配置，避免影响其他开发者 / CI / 真机环境
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvmargs=-Xmx1g
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# ===== 2. 构建缓存 =====
org.gradle.caching=true
org.gradle.configuration-cache=false
# 本地构建缓存目录（自动适配不同环境）
org.gradle.caching.local.dir=${GRADLE_USER_HOME}/caches/build-cache-2.41
# 构建缓存 TTL（7 天）
org.gradle.caching.local.ttl.days=7

# ===== 3. Kotlin 编译优化 =====
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.enabled=true
kotlin.compiler.execution.strategy=in-process

# ===== 4. 网络优化配置 =====
# HTTPS 配置
systemProp.https.protocols=TLSv1.2,TLSv1.3

# 超时配置 - release 构建依赖较多，放宽超时
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=300000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=300000

# 重试配置 - 指数退避策略
systemProp.org.gradle.internal.network.retry.max.attempts=10
systemProp.org.gradle.internal.network.retry.initial.backOff=1000
systemProp.org.gradle.internal.network.retry.max.backOff=10000
systemProp.org.gradle.internal.network.retry.backOff.multiplier=2

# ===== 5. 代理配置 =====
# 代理配置已移至 ~/.gradle/gradle.properties（用户级）或 CI 环境变量注入
# 如需代理，请在用户级 gradle.properties 中添加：
# systemProp.http.proxyHost=your.proxy.host
# systemProp.http.proxyPort=your.proxy.port
# systemProp.https.proxyHost=your.proxy.host
# systemProp.https.proxyPort=your.proxy.port

# ===== 6. Android 配置 =====
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableResourceNamespaces=true
# AGP 8.9.1 完全支持 compileSdk=35
android.suppressUnsupportedCompileSdk=35

# ===== 6.1 Android 15+ 16KB Page Size 兼容 =====
# Android 15+ (API 35) 要求所有原生库在 16KB page-size 设备上可加载
# AGP 8.5.1+ 默认对齐 16KB；此处强制开启以应对旧依赖
android.experimental.enableNewResourceShrinker=true
# 启用 R8 完整模式以减小体积并提升 16KB 兼容
android.enableR8.fullMode=true

# ===== 7. 安全配置 =====
# 友盟统计 AppKey 已移至 local.properties（已 gitignore），不在版本控制中
# 如需配置，请在 local.properties 中添加：
# UMENG_APPKEY=your_real_appkey
# UMENG_MESSAGE_SECRET=your_real_secret

# Release 签名配置（发布前填入）
# RELEASE_STORE_FILE=release.keystore
# RELEASE_STORE_PASSWORD=YOUR_STORE_PASSWORD
# RELEASE_KEY_ALIAS=omaster
# RELEASE_KEY_PASSWORD=YOUR_KEY_PASSWORD

# ===== 8. 离线模式配置（可选） =====
# 启用离线模式时取消注释（需要先完整构建一次下载所有依赖）
# org.gradle.offline=true

# ===== 9. 日志级别 =====
# 详细日志（调试网络问题时启用）
# org.gradle.logging.level=debug

# ===== 10. 构建性能监控 =====
# 构建时间分析（调试时启用）
# org.gradle.build-time-analysis=true