# Project-wide Gradle settings.
# Release 构建配置（简化版，避免配置缓存卡死）

# ===== 1. Gradle Daemon + JVM 调优 =====
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true

# ===== 2. 构建缓存（Release 构建禁用配置缓存） =====
org.gradle.caching=true
org.gradle.configuration-cache=false

# ===== 3. Kotlin 编译优化 =====
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

# ===== 4. 网络优化配置 =====
systemProp.https.protocols=TLSv1.2,TLSv1.3

# 代理配置（沙箱环境必需）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|10.*|192.168.*

# ===== 5. Android 配置 =====
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableResourceNamespaces=true

# ===== 6. 安全配置（发布前填入真实值） =====
UMENG_APPKEY=YOUR_UMENG_APPKEY
UMENG_MESSAGE_SECRET=YOUR_UMENG_MESSAGE_SECRET

# Release 签名配置（发布前填入）
# RELEASE_STORE_FILE=release.keystore
# RELEASE_STORE_PASSWORD=YOUR_STORE_PASSWORD
# RELEASE_KEY_ALIAS=omaster
# RELEASE_KEY_PASSWORD=YOUR_KEY_PASSWORD
