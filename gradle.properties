# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ========== JVM 配置 ==========
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC

# ========== Android 配置 ==========
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# ========== Gradle 构建优化 ==========
# Enables the Configuration Cache to speed up this build
org.gradle.configuration-cache=true
# Enables the Build Cache to speed up incremental builds
org.gradle.caching=true
# 降低并行度，避免网络拥塞和资源竞争
org.gradle.parallel=false
# 限制最大工作进程数
org.gradle.workers.max=2

# ========== 网络超时配置（针对国内网络环境优化）==========
# 连接超时设置为10分钟（600秒）
org.gradle.internal.http.connectionTimeout=600000
org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000

# HTTP/HTTPS 客户端超时配置
systemProp.http.connectionTimeout=600000
systemProp.http.socketTimeout=600000
systemProp.https.connectionTimeout=600000
systemProp.https.socketTimeout=600000

# ========== 网络重试配置 ==========
# 最大重试次数
systemProp.org.gradle.internal.network.retry.max.attempts=15
# 初始退避时间（毫秒）
systemProp.org.gradle.internal.network.retry.initial.backOff=3000

# ========== 代理配置（默认禁用，需要时取消注释）==========
# HTTP 代理设置
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# 不使用代理的主机
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.huaweicloud.com|*.tsinghua.edu.cn|*.cloud.tencent.com

# ========== 离线模式（可选，完全离线时启用）==========
# org.gradle.caching.directory-based=true