# Project-wide Gradle settings.
# 深度优化配置 - 2026-06-12
# 基于网络诊断：腾讯云镜像稳定可达

# ===== 0. 指定Gradle使用的Java版本（避免Gradle选择错误的Java版本）=====
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2

# ===== 1. Gradle Daemon 深度优化 =====
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# 关键修复：覆盖默认的JVM参数（默认是-Xmx512m，太小会导致构建卡住）
# 沙箱容器内存限制为4GB，因此使用保守1.5GB堆（D8/R8 dexing很吃内存）
org.gradle.daemon.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.awt.headless=true

# JVM 内存优化（同时设置jvmargs以确保生效）
org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.awt.headless=true

# 并行执行优化（降低并行度以减少内存压力）
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=false

# Kotlin/Javac 内存限制
kotlin.daemon.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=384m

# ===== 2. 构建缓存深度优化 =====
org.gradle.caching=true
# 临时关闭configuration-cache，避免缓存问题导致卡住
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.max-problems=10

# 本地构建缓存
org.gradle.buildcache.local.enabled=true
org.gradle.buildcache.local.directory=/root/.gradle/build-cache

# ===== 3. 网络优化配置 =====
# 网络超时优化（更短的超时以快速失败并切换到下一个IP/仓库）
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.network.retry.max.attempts=10
systemProp.org.gradle.internal.network.retry.initial.backOff=1000
systemProp.org.gradle.internal.network.retry.max.backOff=10000

# 仓库重试配置
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.initial.backoff=1000
org.gradle.internal.repository.max.backoff=10000

# JVM 网络参数
systemProp.http.keepAlive=true
systemProp.http.maxConnections=20
systemProp.https.keepAlive=true
systemProp.https.maxConnections=20

# ===== HTTP/HTTPS 代理配置 =====
# 沙箱环境强制走 MCP 代理 127.0.0.1:18080（已验证支持 HTTPS CONNECT）
# 这是关键修复：直连 Tencent 镜像时 DNS 解析到不可达 IP
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1

# Java 网络参数
networkaddress.cache.ttl=60
networkaddress.cache.negative.ttl=10

# ===== 4. 镜像源配置 =====
systemProp.gradle.user.home=/root/.gradle

# ===== 5. Android 构建优化 =====
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableResourceNamespaces=true
# android.enableBuildCache 已在 AGP 7.0 移除（被 Gradle build cache 取代）

# 编译优化（AGP 8.x 已移除以下选项）
# android.enableIncrementalAnnotationProcessing=true  # AGP 8.x 已默认启用，无需设置
# android.enableSeparateAnnotationProcessing=true  # AGP 4.0 已移除，移除配置

# R8/ProGuard 优化
android.enableR8.fullMode=true

# ===== 6. Kotlin 优化 =====
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.android=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# ===== 7. Compose 优化 =====
android.enableComposeCompilerMetrics=true
android.enableComposeCompilerReports=true

# ===== 8. 测试优化 =====
android.testInstrumentationRunnerArguments.size=medium