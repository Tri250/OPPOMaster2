# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ========== 1. Gradle Daemon + JVM 调优（必做，零成本高收益）==========
# Daemon 常驻，避免每次冷启动
org.gradle.daemon=true

# JVM 堆内存 — 4GB 起步，大项目可到 8GB
# 使用 ParallelGC 比 G1 在构建场景吞吐量高 10-15%
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ========== 2. 构建缓存（收益极大）==========
# 本地构建缓存 — 跨工程复用
org.gradle.caching=true
# 配置缓存 — AGP 8.1+ 稳定可用
org.gradle.configuration-cache=true

# ========== 3. 并行编译优化 ==========
# 并行编译所有模块
org.gradle.parallel=true
# 只配置需要的模块
org.gradle.configureondemand=true
# 工作进程数（根据机器核心数调整）
org.gradle.workers.max=4

# ========== Android 配置 ==========
android.useAndroidX=true
kotlin.code.style=official
# 启用非传递R类，减少R类大小
android.nonTransitiveRClass=true
# 启用资源命名空间，防止资源冲突
android.enableResourceNamespaces=true

# ========== 网络超时配置（针对国内网络环境优化）==========
# 连接超时设置为10分钟（600秒）
org.gradle.internal.http.connectionTimeout=600000
org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000

# HTTP/HTTPS 客户端超时配置
systemProp.http.connectionTimeout=600000
systemProp.http.socketTimeout=600000
systemProp.https.connectionTimeout=600000
systemProp.https.socketTimeout=600000

# ========== 网络重试配置 ==========
# 最大重试次数
systemProp.org.gradle.internal.network.retry.max.attempts=15
# 初始退避时间（毫秒）
systemProp.org.gradle.internal.network.retry.initial.backOff=3000

# ========== 代理配置（默认禁用，需要时取消注释）==========
# HTTP 代理设置
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# 不使用代理的主机
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.huaweicloud.com|*.tsinghua.edu.cn|*.cloud.tencent.com

# ========== 离线模式（可选，完全离线时启用）==========
# org.gradle.caching.directory-based=true