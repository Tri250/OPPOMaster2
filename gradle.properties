# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ===== 1. Gradle Daemon + JVM 调优（必做，零成本高收益） =====
# Daemon 常驻，避免每次冷启动
org.gradle.daemon=true

# JVM 堆内存配置 - 使用 ParallelGC + StringDeduplication 提升构建吞吐量
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 最大并行 worker 数
org.gradle.workers.max=4

# 并行编译所有模块
org.gradle.parallel=true

# 只配置需要的模块（按需配置）
org.gradle.configureondemand=true

# 文件系统监视（增量构建）
org.gradle.vfs.watch=true

# ===== 2. 构建缓存（收益极大） =====
# 本地构建缓存 - 跨工程复用
org.gradle.caching=true

# 配置缓存并行
org.gradle.configuration-cache.parallel=true

# 配置缓存 - AGP 8.1+ 稳定可用
org.gradle.configuration-cache=true

# 配置缓存最大问题数
org.gradle.configuration-cache.max-problems=5

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
# AndroidX 包结构
android.useAndroidX=true

# Kotlin 代码风格
kotlin.code.style=official

# 启用非传递性 R 类，减少 R 类大小
android.nonTransitiveRClass=true

# ===== 3. 资源优化配置 =====
# 启用资源命名空间，防止资源重复
android.enableResourceNamespaces=true

# ===== 网络超时和重试配置 =====
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.network.retry.max.attempts=5
systemProp.org.gradle.internal.network.retry.initial.backOff=1000
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000