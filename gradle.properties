# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ==================== JVM 配置 ====================
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ParallelGCThreads=4

# ==================== 构建性能优化 ====================
# 启用并行构建（多模块项目性能提升显著）
org.gradle.parallel=true
# 启用按需配置（仅配置需要的模块）
org.gradle.configureondemand=true
# 启用构建缓存
org.gradle.caching=true
# 启用配置缓存（加速配置阶段）
org.gradle.configuration-cache=true
# 启用文件系统监视（加速增量构建）
org.gradle.vfs.watch=true

# ==================== Android 构建优化 ====================
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# 非传递 R 类（减少 R 类大小）
android.nonTransitiveRClass=true
# 启用 Jetifier（迁移旧支持库）
android.enableJetifier=false

# ==================== 网络配置 ====================
# 网络超时和重试配置
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
# 网络重试配置
systemProp.org.gradle.internal.network.retry.max.attempts=5
systemProp.org.gradle.internal.network.retry.initial.backOff=1000
# HTTP客户端配置
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=60000