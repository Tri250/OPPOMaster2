# Project-wide Gradle settings.
# 优化网络配置解决依赖下载问题

# ===== 1. Gradle Daemon + JVM 调优 =====
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# ===== 2. 构建缓存 =====
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.caching.local.dir=${GRADLE_USER_HOME}/caches/build-cache-2.41
org.gradle.caching.local.ttl.days=7

# ===== 3. Kotlin 编译优化 =====
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.enabled=true
kotlin.compiler.execution.strategy=in-process

# ===== 4. 网络优化配置 =====
# 增加超时时间以适应慢速网络
systemProp.https.protocols=TLSv1.2,TLSv1.3
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=300000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=300000

# 重试配置
systemProp.org.gradle.internal.network.retry.max.attempts=15
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
systemProp.org.gradle.internal.network.retry.max.backOff=30000
systemProp.org.gradle.internal.network.retry.backOff.multiplier=2

# ===== 5. 仓库镜像配置 =====
# 使用阿里云镜像加速
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# ===== 6. Android 配置 =====
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableResourceNamespaces=true
android.suppressUnsupportedCompileSdk=35

# ===== 7. 安全配置 =====
# Release 签名配置（发布前填入）
# RELEASE_STORE_FILE=release.keystore
# RELEASE_STORE_PASSWORD=YOUR_STORE_PASSWORD
# RELEASE_KEY_ALIAS=omaster
# RELEASE_KEY_PASSWORD=YOUR_KEY_PASSWORD

# ===== 8. 日志级别 =====
# 详细日志（调试网络问题时启用）
org.gradle.logging.level=info
