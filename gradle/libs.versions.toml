[versions]
# ===== Android Gradle Plugin =====
agp = "8.7.3"

# ===== Kotlin =====
kotlin = "2.1.0"

# ===== AndroidX Core =====
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"

# ===== Compose =====
composeBom = "2025.01.01"
activityCompose = "1.9.3"
material = "1.7.6"
material3 = "1.3.1"

# ===== Navigation =====
navigationCompose = "2.8.5"

# ===== Networking =====
coil = "2.7.0"
ktor = "3.0.3"
gson = "2.11.0"

# ===== Serialization =====
kotlinxSerialization = "1.8.0"

# ===== ML & AI =====
mlkit-face-detection = "16.1.7"
tensorflow-lite = "2.16.1"
tensorflow-lite-gpu = "2.16.1"
tensorflow-lite-support = "0.4.4"

# ===== Analytics =====
umeng-common = "9.9.2"
umeng-asms = "1.8.7.2"

# ===== Coroutines =====
kotlinx-coroutines-play-services = "1.10.1"

# ===== Testing =====
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# 新增依赖库
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# ===== 新增硬编码依赖 =====
# Compose Material（用于 pull-to-refresh）
androidx-compose-material = { group = "androidx.compose.material", name = "material", version.ref = "material" }

# Ktor 全家桶
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# 友盟
umeng-common = { group = "com.umeng.umsdk", name = "common", version.ref = "umeng-common" }
umeng-asms = { group = "com.umeng.umsdk", name = "asms", version.ref = "umeng-asms" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

# ML Kit 人脸检测
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkit-face-detection" }

# TensorFlow Lite
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflow-lite" }
tensorflow-lite-gpu = { group = "org.tensorflow", name = "tensorflow-lite-gpu", version.ref = "tensorflow-lite-gpu" }
tensorflow-lite-support = { group = "org.tensorflow", name = "tensorflow-lite-support", version.ref = "tensorflow-lite-support" }

# kotlinx-coroutines-play-services (Task -> suspend bridge for ML Kit)
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines-play-services" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
