# Gradle Wrapper 配置 - 国内镜像优化版
# 更新时间: 2026-06-12
# 维护者: OMaster Team

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# ===== 国内镜像配置（优先级排序） =====
# 阿里云镜像 - 最稳定，推荐首选
distributionUrl=https\://mirrors.aliyun.com/gradle/distributions/gradle-8.14.4-bin.zip

# 腾讯云镜像（阿里云不可用时使用）
# distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip

# 华为云镜像（备用）
# distributionUrl=https\://repo.huaweicloud.com/gradle/gradle-8.14.4-bin.zip

# 官方镜像（国内网络不建议使用）
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.4-bin.zip

# ===== 网络超时配置 =====
networkTimeout=60000
validateDistributionUrl=false

# ===== 下载重试配置 =====
# 重试次数
systemProp.org.gradle.wrapper.retry.count=3
# 重试间隔（毫秒）
systemProp.org.gradle.wrapper.retry.interval=5000