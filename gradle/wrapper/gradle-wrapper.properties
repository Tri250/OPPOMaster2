# Gradle Wrapper 配置 - 国内镜像加速版
# 更新时间: 2026-06-22

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# ===== Gradle 分发下载 URL =====
# 腾讯云镜像（国内加速默认，实测 8.14.4 可用且速度最快）
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip
# 华为云镜像（备选）
# distributionUrl=https\://repo.huaweicloud.com/gradle/gradle-8.14.4-bin.zip
# 官方源（保证可用性，国内镜像失败时切换）
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.4-bin.zip
# 阿里云镜像（无 8.14.4 版本，暂不使用）
# distributionUrl=https\://mirrors.aliyun.com/gradle/gradle-8.14.4-bin.zip

# ===== 网络超时配置 =====
networkTimeout=120000
validateDistributionUrl=false

# ===== 下载重试配置 =====
systemProp.org.gradle.wrapper.retry.count=5
systemProp.org.gradle.wrapper.retry.interval=3000
