# Gradle Wrapper 配置 - 国内镜像优化版
# 更新时间: 2026-06-12

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# ===== 国内镜像优先级配置 =====
# 腾讯云 Gradle 镜像 - 沙箱环境测试可用，响应 0.05s
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip

# 备用镜像（腾讯云不可用时使用）
# distributionUrl=https\://mirrors.aliyun.com/gradle/distributions/v8.14.4/gradle-8.14.4-bin.zip

# 官方镜像（最后备用）
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.4-bin.zip

# ===== 网络超时配置 =====
networkTimeout=300000
validateDistributionUrl=false

# ===== 系统属性配置 =====
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
