# Gradle Wrapper 配置 - 国内镜像加速版
# 更新时间: 2026-06-22

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# ===== Gradle 分发下载 URL =====
# 使用阿里云镜像加速；Gradle 8.14 是真实存在的稳定版本，兼容 Kotlin 2.0.21+
# 阿里云镜像（国内加速）
distributionUrl=https\://mirrors.aliyun.com/gradle/gradle-8.14-bin.zip
# 腾讯云镜像（备选）
# distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14-bin.zip
# 官方源（保底）
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip

# ===== 网络超时配置 =====
networkTimeout=120000
validateDistributionUrl=false

# ===== 下载重试配置 =====
systemProp.org.gradle.wrapper.retry.count=5
systemProp.org.gradle.wrapper.retry.interval=3000
