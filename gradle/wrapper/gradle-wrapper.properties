# Gradle Wrapper 配置 - 沙箱环境优化版
# 更新时间: 2026-06-13
# 使用本地 zip 加速构建，避免网络下载

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# ===== 本地文件路径（沙箱环境使用）=====
# 直接指向本地预下载的 zip 文件
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip

# ===== 备用网络镜像 =====
# distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip
# distributionUrl=https\://mirrors.aliyun.com/gradle/gradle-8.14.4-bin.zip
# distributionUrl=https\://repo.huaweicloud.com/gradle/gradle-8.14.4-bin.zip

# ===== 网络超时配置 =====
networkTimeout=60000
validateDistributionUrl=false

# ===== 下载重试配置 =====
systemProp.org.gradle.wrapper.retry.count=5
systemProp.org.gradle.wrapper.retry.interval=3000