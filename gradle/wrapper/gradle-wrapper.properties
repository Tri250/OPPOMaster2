# =============================================================================
# Gradle Wrapper 配置
# =============================================================================
# 官方地址：https://services.gradle.org/distributions/
# 腾讯镜像：https://mirrors.cloud.tencent.com/gradle/（推荐，版本最全）
# 阿里云镜像：https://mirrors.aliyun.com/gradle/
# 阿里云macports：https://mirrors.aliyun.com/macports/distfiles/gradle/
# =============================================================================

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# 首选：腾讯云镜像（版本最全，速度稳定）
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip

# 备选镜像（如腾讯云不可用，可切换）：
# 阿里云 gradle：https\://mirrors.aliyun.com/gradle/gradle-8.14.4-bin.zip
# 阿里云 macports：https\://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.14.4-bin.zip
# 官方源：https\://services.gradle.org/distributions/gradle-8.14.4-bin.zip

# 网络超时配置（5分钟）
networkTimeout=300000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
