# Gradle Wrapper 配置 - 沙箱环境优化版
# 更新时间: 2026-06-13
# 使用腾讯云镜像加速构建

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# ===== 网络镜像（备用：腾讯云，国内可达）=====
# 沙箱环境网络不稳定，主走 file:// 协议本地化，备用 Tencent Cloud
distributionUrl=file\:/tmp/gradle-8.14.4-bin.zip
distributionUrlFallback=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip

# ===== 网络超时配置（沙箱环境放宽至 5 分钟）=====
networkTimeout=300000
validateDistributionUrl=false

# ===== 下载重试配置（指数退避）=====
systemProp.org.gradle.wrapper.retry.count=10
systemProp.org.gradle.wrapper.retry.interval=5000