# Gradle Wrapper 配置 - 深度优化版
# 更新时间: 2026-06-12

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# ===== 国内镜像优先级配置 =====
# 阿里云 Gradle 镜像 - 推荐，速度快且稳定
distributionUrl=https\://mirrors.aliyun.com/gradle/distributions/v8.14.4/gradle-8.14.4-bin.zip

# 备用镜像（阿里云不可用时使用）
# distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.4-bin.zip

# 官方镜像（最后备用）
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.4-bin.zip

# ===== 网络超时配置 =====
networkTimeout=600000
validateDistributionUrl=false

# ===== 系统属性配置 =====
systemProp.http.connectionTimeout=300000
systemProp.http.socketTimeout=300000
systemProp.https.connectionTimeout=300000
systemProp.https.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.network.retry.max.attempts=20
